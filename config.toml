# Scrying Pool configuration.
# Edit the values below, then run `python -m cts ingest`.
# Every command takes `--config PATH` if you keep this somewhere else.

# Base URL of your running Ollama server (no trailing slash).
ollama_url = "http://localhost:11434"

# --- Models -------------------------------------------------------------
# These are working examples for a typical Ollama install — swap freely.
# No model name is hardcoded anywhere in the code; `python -m cts refresh`
# preflights each distinct name below against /api/tags before doing any work.
# Pull them first, e.g. `ollama pull qwen2.5vl:7b`.

# Vision model. Reads each art crop and writes the two description layers
# (Phase 5). Must be multimodal. Bigger is better here — this pass is the
# highest-leverage step in the project and nothing downstream can recover a
# detail it failed to record.
vision_model = "qwen3.5:122b"

# Verification model. The one multimodal call per finalist at the end of a search
# ("does this theme genuinely hold for this image, yes/no" — see judge.py's
# verify_finalists). Optional: when unset it falls back to vision_model, which is
# what every config written before this key existed does.
#
# Set it separately because the two jobs have opposite requirements. vision_model
# writes 5,530 open-ended descriptions once, and wants to be as large as the card
# allows. This one answers ~8 binary questions per query, forever, and its size is
# paid on every search.
#
# The reason that matters is VRAM coexistence, not raw speed. A search interleaves
# ~10 judge_model calls with ~7 verify calls. On a 96 GB card, judge and
# qwen3.5:122b (81 GiB) sum to well over the card and cannot both be resident, so
# Ollama evicts and reloads between every single call. Pointing verify_model at the
# judge model makes it literally the same resident instance: one load, zero
# evictions.
#
# As of 2026-08-18 this points at scryingpool-qwen3.8:latest, built from
# models/scryingpool.Modelfile (`FROM qwen3.8`), not the base registry model
# directly — the Modelfile pins PARAMETER num_ctx 32768 (qwen3.8 defaults to its
# full 262,144-token window otherwise, which is what caused the 300s-timeout
# incident documented at cts/oracle_judge.py::JUDGE_NUM_CTX; cts/judge.py's
# judge_batch/verify_finalists and cts/search.py's route/expand never set num_ctx
# per-call, so this Modelfile default is what actually bounds those calls) and
# PARAMETER temperature 0 (belt-and-suspenders — every call site already passes
# its own temperature explicitly). Rebuild with
# `ollama create scryingpool-qwen3.8 -f models/scryingpool.Modelfile` after
# editing that file. See models/scryingpool.Modelfile for the full sizing
# rationale.
#
# qwen3.8 replaced qwen3.6 here because it is multimodal (vision + tools +
# thinking, confirmed via `ollama show`) at ~17.7 GB resident vs. qwen3.6's
# ~23 GB, and — same as before — pointing verify_model at judge_model keeps this
# a one-resident-model setup with zero evictions between judge and verify calls
# (confirmed live via `ollama ps` during a real search: exactly one
# scryingpool-qwen3.8 instance resident alongside embed_model, never a second
# distinct judge/verify model).
#
# Latency measured 2026-08-18, two real `cts search` runs on the shipped corpus:
# ~217s cold (first call, model not yet loaded) and ~155s warm (model already
# resident, zero evictions) — both slower than the ~77-95s qwen3.6 baseline this
# config used to run at. qwen3.6 is architecture "qwen35moe" (36B total, mixture
# of experts, only a fraction active per token); qwen3.8 is "qwen35" (27.3B
# dense, all params active every token). Despite being smaller on disk, dense
# qwen3.8 appears to cost more compute per call than sparse qwen3.6 did — this
# reads as an architecture trade-off, not a misconfiguration. Quality on those
# same two searches plus one `cts oracle` query looked sound: judge rationales
# cited real, relevant propositions, fit scores were sensibly calibrated (1.0
# unmistakable down to 0.6 for genuine stretches), and the oracle query's
# filters and results were exactly right. This is a small spot-check, not the
# rigorous 60-finalist study below — run `python -m cts eval` for that before
# trusting the swap blind in production.
#
# Historical reference, from when this pointed at qwen3.6:latest: measured on 60
# real finalists against qwen3.5:122b as reference, qwen3.6 agreed 70% overall,
# but 100% on the compositional queries where careful looking is the whole point
# (counting figures, reading inscriptions, "walking away" vs "standing still").
# Its disagreements were concentrated on "commanders that are <species>" themes,
# and inspecting those crops by hand showed the 81 GB model was usually the one in
# the wrong there — it read "commander" as requiring a military figure and
# rejected artwork that plainly matches. gemma4:31b scored the same 70% overall
# but only 80% on the compositional set, and was ~2.5x slower per call.
verify_model = "scryingpool-qwen3.8:latest"

# Embedding model. Embeds every proposition (Phase 6). Must be an embedding
# model, not a chat model. Changing this invalidates the stored vectors:
# clear the `embeddings` table and re-run `python -m cts embed`.
embed_model = "nomic-embed-text"

# Judge / router model. Query routing, theme expansion, candidate judging and
# the synthetic theme corpus (Phases 7, 8, 12). Text-only is fine, but as of
# 2026-08-18 this is the same scryingpool-qwen3.8:latest model as verify_model —
# see that key's comment for why (one resident model, zero evictions) and for
# what models/scryingpool.Modelfile pins and why (num_ctx 32768, temperature 0).
judge_model = "scryingpool-qwen3.8:latest"

# --- Storage ------------------------------------------------------------

# SQLite database. Parent directories are created automatically.
db_path = "data/commanders.db"

# Art crops are downloaded to <art_dir>/<illustration_id>.jpg
art_dir = "data/art"

# The oracle corpus: every paper card's rules text, one row per oracle_id, from
# Scryfall's `oracle_cards` bulk file. Deliberately a SECOND database file rather
# than more tables in db_path, because the two corpora are disjoint at every
# level — different grain (oracle_id vs illustration_id), different scope
# (~32,700 paper cards vs 3,202 commander-legal ones), different refresh costs.
# Sharing a file would put ~16 hours of vision work at risk on every migration,
# VACUUM and restore, to serve a corpus that rebuilds from scratch in minutes.
# The separation is the backup strategy. Nothing ever joins or ATTACHes the two.
oracle_db_path = "data/oracle.db"

# --- Power score weights (Phase 3) --------------------------------------
# The composite power score blends four components, each normalized across the
# corpus and stored separately in power.components so weights can be retuned
# without recomputing anything. Bands are five quantile buckets over the final
# score, computed at query time.
[power_weights]

# Normalized log of EDHREC deck count. Popularity, not power — but it is the
# strongest single signal available, so it carries the most weight.
deck_count = 0.4

# Average deck price percentile. Expensive decks correlate with strong staples.
price = 0.25

# Average mana value of the commander itself. Cheap commanders do more, sooner.
cmc = 0.2

# cEDH presence flag, when EDHREC exposes one.
# Not rare: live EDHREC data tags at least one cEDH deck for very nearly every
# commander that has a page at all, so this flag reads 1 for most of the corpus
# and mostly restates deck count. power.py warns when it fires on more than 80%
# of the corpus, and stores `cedh_share` and `bracket5_share` (bracket 5 is the
# official cEDH bracket) alongside it in power.components — switching the scored
# term to one of those continuous signals is a one-line change in power.py's
# `score = ...` sum and needs no re-fetch.
cedh = 0.15
